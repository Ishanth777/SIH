# Cooperative Labour Marketplace — Local Development Infrastructure
# Run: docker compose up -d
# Verify: docker compose ps

services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: coop-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coop_user
      POSTGRES_PASSWORD: coop_password
      POSTGRES_DB: coop_marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coop_user -d coop_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgBouncer (Connection Pooler) ─────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0-p2
    container_name: coop-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: postgres://coop_user:coop_password@postgres:5432/coop_marketplace
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: coop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible Object Storage) ──────────────────────
  minio:
    image: minio/minio:latest
    container_name: coop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI Forecasting Microservice (FastAPI) ─────────────────────
  forecasting:
    build:
      context: ../../apps/forecasting
      dockerfile: Dockerfile
    container_name: coop-forecasting
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
