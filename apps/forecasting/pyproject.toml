[tool.poetry]
name = "forecasting-service"
version = "1.0.0"
description = "AI Demand Forecasting Microservice for Cooperative Labour Marketplace"
authors = ["Squad 6 Intelligence & Infrastructure <squad6@coop.platform>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.109.0,<1.0.0"
uvicorn = {extras = ["standard"], version = ">=0.27.0,<1.0.0"}
pydantic = ">=2.5.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
