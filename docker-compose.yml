# Cooperative Labour Marketplace — Full Stack Container Orchestration
# Run: docker compose up -d
# Stop: docker compose down

services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: coop-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coop_user
      POSTGRES_PASSWORD: coop_password
      POSTGRES_DB: coop_marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coop_user -d coop_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PgBouncer (Connection Pooler) ─────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: coop-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: postgres://coop_user:coop_password@postgres:5432/coop_marketplace
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: coop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible Object Storage) ──────────────────────
  minio:
    image: minio/minio:latest
    container_name: coop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI Forecasting Microservice (FastAPI) ─────────────────────
  forecasting:
    build:
      context: ./apps/forecasting
      dockerfile: Dockerfile
    container_name: coop-forecasting
    restart: unless-stopped
    ports:
      - "8000:8000"

  # ── Backend API (NestJS + Prisma + Socket.IO) ─────────────────
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: coop-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_PORT: 3000
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:3001
      DATABASE_URL: postgresql://coop_user:coop_password@postgres:5432/coop_marketplace?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: coop-documents
      JWT_ACCESS_SECRET: sih26089_jwt_access_super_secret_key_2026_dev
      JWT_REFRESH_SECRET: sih26089_jwt_refresh_super_secret_key_2026_dev
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      OTP_EXPIRY_SECONDS: 300
      OTP_LENGTH: 6
      FORECASTING_SERVICE_URL: http://forecasting:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Web Frontend (Next.js 14 - Port 3001) ─────────────────────
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: coop-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
