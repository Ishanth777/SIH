# ============================================================
# Cooperative Labour Marketplace — Full Stack Docker Compose
# ============================================================
# Usage:
#   docker compose up --build -d
#   docker compose ps
#   docker compose logs -f
# ============================================================

services:
  # ── PostgreSQL 16 + PostGIS ─────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: coop-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coop_password}
      POSTGRES_DB: ${POSTGRES_DB:-coop_marketplace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-scripts/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coop_user} -d ${POSTGRES_DB:-coop_marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coop-network

  # ── Redis 7 ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: coop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coop-network

  # ── MinIO (S3-compatible Object Storage) ─────────────────────
  minio:
    image: minio/minio:latest
    container_name: coop-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coop_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-coop_minio_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coop-network

  # ── MinIO Bucket Initializer ─────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: coop-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 ${MINIO_ROOT_USER:-coop_minio_admin} ${MINIO_ROOT_PASSWORD:-coop_minio_secret};
      /usr/bin/mc mb --ignore-existing localminio/${MINIO_BUCKET:-coop-documents};
      /usr/bin/mc anonymous set download localminio/${MINIO_BUCKET:-coop-documents};
      exit 0;
      "
    networks:
      - coop-network

  # ── AI Demand Forecasting Microservice (FastAPI) ────────────
  forecasting:
    build:
      context: apps/forecasting
      dockerfile: Dockerfile
    container_name: coop-forecasting
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coop-network

  # ── Backend API (NestJS + Prisma) ───────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: coop-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      forecasting:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - API_PREFIX=api
      - CORS_ORIGINS=http://localhost:3001,http://localhost:3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-coop_user}:${POSTGRES_PASSWORD:-coop_password}@postgres:5432/${POSTGRES_DB:-coop_marketplace}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-coop_minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-coop_minio_secret}
      - MINIO_BUCKET=${MINIO_BUCKET:-coop-documents}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-sih26089_jwt_access_super_secret_key_2026_dev}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-sih26089_jwt_refresh_super_secret_key_2026_dev}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - OTP_EXPIRY_SECONDS=${OTP_EXPIRY_SECONDS:-300}
      - OTP_LENGTH=${OTP_LENGTH:-6}
      - FORECASTING_SERVICE_URL=http://forecasting:8000
    networks:
      - coop-network

  # ── Web Client (Next.js 14) ──────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3000
    container_name: coop-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3000
    networks:
      - coop-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  coop-network:
    driver: bridge
