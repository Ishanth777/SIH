name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Lint & Type Check ───────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate

      - name: Type check shared-types
        run: pnpm --filter shared-types build

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build

  # ── Backend Unit & Integration Tests ────────────────────────
  test-api:
    name: API Tests & RLS Gate
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: coop_user
          POSTGRES_PASSWORD: coop_password
          POSTGRES_DB: coop_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coop_user -d coop_marketplace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://coop_user:coop_password@localhost:5432/coop_marketplace?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-test-access-secret-minimum-16-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-16-chars
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      NODE_ENV: test
      API_PORT: 3000
      API_PREFIX: api

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate

      - name: Push database schema (Non-interactive CI migration)
        run: pnpm --filter api exec prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://coop_user:coop_password@localhost:5432/coop_marketplace?schema=public

      - name: Apply RLS policies
        run: pnpm --filter api exec prisma db execute --file ../../infra/docker/init-scripts/02-rls-policies.sql --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://coop_user:coop_password@localhost:5432/coop_marketplace?schema=public

      - name: Run unit tests
        run: pnpm --filter api test

      - name: Run integration tests (Rule T2: permanent RLS gate)
        run: pnpm --filter api test:e2e
        env:
          DATABASE_URL: postgresql://coop_user:coop_password@localhost:5432/coop_marketplace?schema=public

  # ── AI Forecasting Tests (Rule E3) ──────────────────────────
  test-forecasting:
    name: Forecasting Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install forecasting dependencies
        working-directory: apps/forecasting
        run: poetry install --no-interaction

      - name: Run pytest
        working-directory: apps/forecasting
        run: poetry run pytest

  # ── Security Audit (Rule S4) ────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Node Audit (Rule S4)
        run: pnpm audit --prod --audit-level=high

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run Python Audit (Rule S4)
        run: pip-audit -r apps/forecasting/requirements.txt

  # ── Container Vulnerability Scan (Rule S5) ───────────────────
  container-scan:
    name: Trivy Container Scan (Rule S5)
    runs-on: ubuntu-latest
    needs: [lint, test-forecasting]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Forecasting Image
        run: docker build -t coop-forecasting:ci -f apps/forecasting/Dockerfile apps/forecasting

      - name: Run Trivy Scan on Forecasting Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: coop-forecasting:ci
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ── Staging Deployment Gate ─────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-api, test-forecasting, audit, container-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Staging Docker Compose Configuration
        run: docker compose -f infra/docker/docker-compose.staging.yml config

      - name: Deploy Staging Stack Notification
        run: echo "Staging infrastructure stack validated and ready for target deployment."
